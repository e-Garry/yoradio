[platformio]
default_envs = esp32-s3-zero
src_dir = src
include_dir = src
data_dir = data

[env:esp32-s3-zero]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit SH110X@2.1.10
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit PCD8544 Nokia 5110 LCD library@2.3.0
  adafruit/Adafruit SSD1327@1.1.2
  adafruit/Adafruit ILI9341@1.6.2
  adafruit/Adafruit SSD1305@1.0.3
  adafruit/TFT_22_ILI9225@1.2.13
  mathertel/OneButton@2.6.1
  crankyoldgit/IRremoteESP8266@2.8.6
  paulstoffregen/XPT2046_Touchscreen@1.4
  adafruit/RTClib@2.1.4

extra_scripts = pre:scripts/patch_gfx_font.py

build_flags =
  -DCORE_DEBUG_LEVEL=0

; Commands from the yoRadio project directory:
;   pio run
;   pio run -t upload
;   pio run -t uploadfs
;   pio device monitor
