name: PlatformIO build

on:
  push:
    branches:
      - platformio/esp32-s3-zero-sh1106
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            yoRadio/.pio
          key: platformio-${{ runner.os }}-${{ hashFiles('yoRadio/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Inject Wi-Fi credentials into SPIFFS
        if: github.event_name != 'pull_request'
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          test -n "$WIFI_SSID" || { echo "Missing repository secret WIFI_SSID"; exit 1; }
          test -n "$WIFI_PASSWORD" || { echo "Missing repository secret WIFI_PASSWORD"; exit 1; }
          mkdir -p yoRadio/data/data
          printf '%s\\t%s\\n' "$WIFI_SSID" "$WIFI_PASSWORD" > yoRadio/data/data/wifi.csv
      - name: Build firmware
        working-directory: yoRadio
        run: pio run
      - name: Build SPIFFS image
        working-directory: yoRadio
        run: pio run -t buildfs
      - name: Prepare boot_app0 image
        run: |
          BOOT_APP0="$(find ~/.platformio/packages -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" yoRadio/.pio/build/esp32-s3-zero/boot_app0.bin
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: yoradio-esp32-s3-zero-sh1106
          path: |
            yoRadio/.pio/build/esp32-s3-zero/firmware.bin
            yoRadio/.pio/build/esp32-s3-zero/bootloader.bin
            yoRadio/.pio/build/esp32-s3-zero/boot_app0.bin
            yoRadio/.pio/build/esp32-s3-zero/partitions.bin
            yoRadio/.pio/build/esp32-s3-zero/spiffs.bin
          if-no-files-found: warn
          retention-days: 14
